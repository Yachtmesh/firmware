name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-native-

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PlatformIO
        run: |
          uv tool install platformio
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run native tests
        run: pio test -e native

  build:
    name: Build firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        env: [esp32dev, esp32s3]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so ESP-IDF's `git describe` can derive
          # PROJECT_VER (embedded firmware version) correctly.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'dependencies.lock') }}
          restore-keys: ${{ runner.os }}-pio-${{ matrix.env }}-

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PlatformIO
        run: |
          uv tool install platformio
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware.elf
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts

      - name: Rename binaries for release
        run: |
          cp artifacts/firmware-esp32dev/firmware.bin firmware-esp32dev-${{ github.ref_name }}.bin
          cp artifacts/firmware-esp32s3/firmware.bin  firmware-esp32s3-${{ github.ref_name }}.bin

      - name: Generate checksums
        run: |
          shasum -a 256 firmware-esp32dev-${{ github.ref_name }}.bin \
                        firmware-esp32s3-${{ github.ref_name }}.bin \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate OTA manifest
        run: |
          dev_sha=$(shasum -a 256 firmware-esp32dev-${{ github.ref_name }}.bin | cut -d' ' -f1)
          s3_sha=$(shasum -a 256 firmware-esp32s3-${{ github.ref_name }}.bin | cut -d' ' -f1)
          dev_size=$(wc -c < firmware-esp32dev-${{ github.ref_name }}.bin | tr -d ' ')
          s3_size=$(wc -c < firmware-esp32s3-${{ github.ref_name }}.bin | tr -d ' ')

          jq -n \
            --arg version "${{ github.ref_name }}" \
            --arg notes "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            --arg devFile "firmware-esp32dev-${{ github.ref_name }}.bin" \
            --arg devSha "$dev_sha" \
            --argjson devSize "$dev_size" \
            --arg s3File "firmware-esp32s3-${{ github.ref_name }}.bin" \
            --arg s3Sha "$s3_sha" \
            --argjson s3Size "$s3_size" \
            '{
              version: $version,
              releaseNotesUrl: $notes,
              targets: {
                esp32dev: { file: $devFile, sha256: $devSha, sizeBytes: $devSize },
                esp32s3:  { file: $s3File,  sha256: $s3Sha,  sizeBytes: $s3Size }
              }
            }' > manifest.json
          cat manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            firmware-esp32dev-${{ github.ref_name }}.bin
            firmware-esp32s3-${{ github.ref_name }}.bin
            SHA256SUMS.txt
            manifest.json
